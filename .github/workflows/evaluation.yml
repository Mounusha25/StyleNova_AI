name: Recommendation evaluation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: evals/requirements.txt
      - name: Install evaluation dependencies
        run: python -m pip install -r evals/requirements.txt
      - name: Validate and normalize catalog
        run: python -m catalog_quality.run
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run recommendation quality gate
        run: python -m evals.run --fail-under-ndcg 0.80
      - name: Run outfit composition quality gate
        run: python -m evals.outfits --fail-under-complete 0.95 --fail-under-validity 1.0
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-evaluation
          path: |
            evals/results/latest.json
            evals/results/outfits.json
            catalog_quality/reports/catalog_quality.json

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
